apply:
  target:
    entity:
      domain: light
  fields:
    brightness_pct:
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    brightness:
      advanced: true
      selector:
        number:
          min: 1
          max: 255
    color_temp_kelvin:
      selector:
        color_temp:
          unit: kelvin
          min: 2000
          max: 6500
    apply_if_on:
      default: false
      selector:
        boolean:

reset_capabilities:
  target:
    entity:
      domain: light
