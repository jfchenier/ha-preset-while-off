apply:
  target:
    entity:
      domain: light
  fields:
    brightness_pct:
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    brightness:
      advanced: true
      selector:
        number:
          min: 1
          max: 255
    color_temp_kelvin:
      selector:
        color_temp:
          unit: kelvin
          min: 2000
          max: 6500
    rgb_color:
      example: "[255, 100, 100]"
      selector:
        color_rgb:
    hs_color:
      advanced: true
      example: "[300, 70]"
      selector:
        object:
    xy_color:
      advanced: true
      example: "[0.52, 0.43]"
      selector:
        object:
    apply_if_on:
      default: false
      selector:
        boolean:

reset_capabilities:
  target:
    entity:
      domain: light
